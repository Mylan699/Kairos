<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kairos, poste de trading cross-asset</title>
    <meta
      name="description"
      content="Kairos consolide actions, change et taux dans un P&amp;L en euros et rejoue des journées de marché historiques. Projet de démonstration en C# .NET et React."
    />
    <meta name="theme-color" content="#0b0e14" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Kairos, poste de trading cross-asset" />
    <meta property="og:description" content="Actions, change et taux dans un seul P&amp;L en euros, avec rejeu de journées de marché historiques." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Kairos et signature Cross-asset trading desk" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Runs before the first paint, so that the light theme never flashes dark.
      try {
        if (localStorage.getItem('kairos-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {
        // Storage can be unavailable in private browsing: the default theme applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
